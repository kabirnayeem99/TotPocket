#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#iOS
# Off by default so everyday Android builds and tests don't configure or compile the iOS targets.
# `src/iosMain` stays on disk and is still written against; it just isn't compiled until this is on.
# Pass -PenableIos=true (or flip this) for iOS work. The Xcode build phase passes the flag itself,
# so building from Xcode works either way.
enableIos=false
