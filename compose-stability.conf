// Types the Compose compiler can't see into but that TotPocket never mutates. Listing them lets
// composables taking them skip recomposition when nothing changed (see wiki/compose-performance-stability.md).
// Kotlin's read-only collections: every list/map/set passed to UI is built fresh, never mutated in place.
kotlin.collections.*
kotlin.time.Duration
// From other modules / libraries, immutable by design.
io.github.kabirnayeem99.totpocket.audio.SoundRef
